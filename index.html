<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Radio</title>
<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    color: #fff;
    background: linear-gradient(270deg, #1a1a2e, #16213e, #0f3460, #533483);
    background-size: 800% 800%;
    animation: shiftColors 15s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  @keyframes shiftColors {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
  }

  .radio-container {
    border: 3px solid white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 0 25px white;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(8px);
  }

  h1 {
    font-size: 2em;
    margin-bottom: 20px;
    text-shadow: 0 0 15px white;
  }

  .station-btn {
    background: transparent;
    border: 2px solid white;
    color: white;
    font-size: 1.1em;
    padding: 12px 25px;
    border-radius: 12px;
    margin: 8px;
    cursor: pointer;
    transition: 0.3s;
    text-shadow: 0 0 10px white;
  }

  .station-btn:hover {
    background: white;
    color: #111;
    box-shadow: 0 0 25px white;
  }

  .note {
    font-size: 0.9em;
    margin-top: 15px;
    opacity: 0.9;
  }

  .nowplaying {
    margin-top: 12px;
    font-size: 1em;
    text-shadow: 0 0 10px white;
  }
</style>
</head>
<body>
  <div class="radio-container">
    <h1>🎧 Neon Radio</h1>

    <button class="station-btn" onclick="playStation('https://ice1.somafm.com/beatblender-128-mp3','SomaFM - Beat Blender')">Play Beat Blender</button>
    <button class="station-btn" onclick="playStation('https://ice1.somafm.com/groovesalad-128-mp3','SomaFM - Groove Salad')">Play Groove Salad</button>
    <button class="station-btn" onclick="playStation('https://ice2.somafm.com/lush-128-mp3','SomaFM - Lush')">Play Lush Ambient</button>
    <button class="station-btn" onclick="playStation('https://stream-55.zeno.fm/f5z6f2a1qg0uv','Kerala FM')">Play Kerala FM</button>

    <p class="nowplaying" id="nowPlaying">Not playing</p>
    <p class="note">If a song keeps playing after you change stations, tap again to refresh playback.</p>
  </div>

  <audio id="radioPlayer"></audio>

  <script>
    const player = document.getElementById('radioPlayer');
    const nowPlaying = document.getElementById('nowPlaying');

    function playStation(url, name) {
      player.pause();
      player.src = url;
      player.load();
      player.play()
        .then(() => {
          nowPlaying.textContent = "Now Playing: " + name;
        })
        .catch(() => {
          alert('Tap again to start playback.');
        });
    }
  </script>
</body>
</html>
